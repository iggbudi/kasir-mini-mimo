<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <title>Pengaturan — Kasir Mini</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <a href="/" class="back-link">← Beranda</a>
      <span class="muted small" id="warung"></span>
    </div>

    <h1 class="title">Pengaturan</h1>

    <section class="card">
      <h3 style="margin:0 0 12px;">Nama Warung</h3>
      <form id="formSetting">
        <input id="namaWarung" type="text" required style="font-size:18px;">
        <p id="status" class="error mt-2"></p>
        <button type="submit" class="primary mt-3">Simpan Nama Warung</button>
      </form>
    </section>

    <section class="card mt-4">
      <h3 style="margin:0 0 12px;">Backup</h3>
      <p class="muted">Unduh salinan database untuk keamanan.</p>
      <button id="backupBtn" class="primary">Download Backup (.json)</button>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/setting.js"></script>
  <script src="/js/page-init.js"></script>
</body>
</html>
