<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <title>Pengeluaran — Kasir Mini</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <a href="/" class="back-link">← Beranda</a>
      <span class="muted small" id="warung"></span>
    </div>

    <nav class="nav-links">
      <a href="/pemasukan.html" class="nav-link">Penjualan</a>
      <a href="/pengeluaran.html" class="nav-link active">Pengeluaran</a>
      <a href="/kulakan.html" class="nav-link">Kulakan</a>
    </nav>

    <h1 class="title">Pengeluaran</h1>

    <section class="card">
      <h3 class="section-title">Tambah Pengeluaran</h3>
      <form id="formPengeluaran">
        <label>Keterangan</label>
        <input id="keterangan" type="text" required placeholder="Contoh: Listrik / Gaji / Bensin">

        <div class="form-row mt-2">
          <div>
            <label>Nominal (Rp)</label>
            <input id="nominal" type="number" min="1" required placeholder="50000">
          </div>
          <div>
            <label>Catatan (opsional)</label>
            <input id="catatan" type="text" placeholder="Opsional">
          </div>
        </div>

        <p class="form-error" id="error"></p>

        <button type="submit" class="primary mt-2" id="btnSubmit">
          <span class="btn-label">Simpan Pengeluaran</span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </section>

    <section class="card mt-3">
      <div class="summary summary-expense">
        <div class="summary-icon"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg></div>
        <div class="summary-content">
          <div class="summary-label">Total Pengeluaran</div>
          <div class="summary-value" id="total">Rp 0</div>
        </div>
      </div>

      <div class="filter-bar" id="filterBar">
        <button class="btn-filter active" data-filter="today">Hari Ini</button>
        <button class="btn-filter" data-filter="yesterday">Kemarin</button>
        <button class="btn-filter" data-filter="custom">Pilih Tanggal</button>
      </div>
      <div id="customDateRange" class="hidden" style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="date" id="dateDari" class="filter-date-input" style="flex:1;">
        <input type="date" id="dateSampai" class="filter-date-input" style="flex:1;">
        <button class="btn-sm primary" id="btnFilterDate" style="width:auto;min-height:36px;">Filter</button>
      </div>

      <div id="list" class="list"></div>
    </section>
  </main>

  <script src="/js/format.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pengeluaran.js"></script>
  <script src="/js/page-init.js"></script>
</body>
</html>
