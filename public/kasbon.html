<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <title>Kasbon — Kasir Mini</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <a href="/" class="back-link">← Beranda</a>
      <span class="muted small" id="warung"></span>
    </div>

    <nav class="nav-links">
      <a href="/pemasukan.html" class="nav-link">Penjualan</a>
      <a href="/pengeluaran.html" class="nav-link">Pengeluaran</a>
      <a href="/kulakan.html" class="nav-link">Kulakan</a>
    </nav>

    <h1 class="title">Kasbon</h1>

    <section class="card">
      <div class="summary summary-neutral">
        <div class="summary-icon"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg></div>
        <div class="summary-content">
          <div class="summary-label">Total Outstanding</div>
          <div class="summary-value" id="totalOutstanding">Rp 0</div>
          <div class="summary-extra" id="count">0 orang</div>
        </div>
      </div>

      <div class="filter-bar">
        <select id="filter" class="filter-date-input" style="border-radius:999px;min-height:36px;width:auto;padding-right:32px;">
          <option value="belum_lunas">Belum Lunas</option>
          <option value="lunas">Lunas</option>
          <option value="semua">Semua</option>
        </select>
      </div>

      <div id="list" class="list"></div>
    </section>

    <section class="card mt-3">
      <h3 class="section-title">Tambah Kasbon Baru</h3>
      <form id="formKasbon">
        <label>Nama Pelanggan</label>
        <input id="nama" type="text" required placeholder="Nama pelanggan">

        <div class="form-row mt-2">
          <div>
            <label>Nominal (Rp)</label>
            <input id="nominal" type="number" min="1" required placeholder="100000">
          </div>
          <div>
            <label>Keterangan (opsional)</label>
            <input id="keterangan" type="text" placeholder="Opsional">
          </div>
        </div>

        <p class="form-error" id="error"></p>

        <button type="submit" class="primary mt-2" id="btnSubmit">
          <span class="btn-label">Simpan Kasbon</span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/kasbon.js"></script>
  <script src="/js/page-init.js"></script>
</body>
</html>
