<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <title>Master Salesman — Kasir Mini</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <a href="/" class="back-link">← Beranda</a>
      <span class="muted small" id="warung"></span>
    </div>

    <h1 class="title">Master Salesman</h1>

    <section class="card">
      <h3 class="section-title" id="formTitle">Tambah Salesman</h3>
      <form id="formSalesman">
        <input id="salesmanId" type="hidden">
        <label for="nama">Nama Salesman</label>
        <input id="nama" type="text" maxlength="100" required placeholder="Contoh: Budi">
        <p class="form-error" id="error"></p>
        <div class="form-row mt-2">
          <button type="submit" class="primary" id="btnSubmit">
            <span class="btn-label">Simpan Salesman</span>
            <span class="btn-spinner"></span>
          </button>
          <button type="button" class="secondary hidden" id="btnCancelEdit">Batal Edit</button>
        </div>
      </form>
    </section>

    <section class="card mt-3">
      <div class="form-row" style="align-items:end;">
        <div>
          <label for="search">Cari Salesman</label>
          <input id="search" type="search" placeholder="Ketik nama salesman">
        </div>
        <div style="max-width:130px;">
          <label for="status">Status</label>
          <select id="status">
            <option value="aktif">Aktif</option>
            <option value="arsip">Diarsipkan</option>
            <option value="semua">Semua</option>
          </select>
        </div>
      </div>
      <div id="list" class="list mt-3"></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/salesman.js"></script>
  <script src="/js/page-init.js"></script>
</body>
</html>
