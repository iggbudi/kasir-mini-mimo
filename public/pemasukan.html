<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f1e6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <title>Penjualan — Kasir Mini</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <a href="/" class="back-link">← Beranda</a>
      <span class="muted small" id="warung"></span>
    </div>

    <nav class="nav-links">
      <a href="/pemasukan.html" class="nav-link active">Penjualan</a>
      <a href="/pengeluaran.html" class="nav-link">Pengeluaran</a>
      <a href="/kulakan.html" class="nav-link">Kulakan</a>
    </nav>

    <h1 class="title">Penjualan</h1>

    <section class="card">
      <label for="jenisHarga">Jenis Penjualan</label>
      <select id="jenisHarga">
        <option value="retail">Retail</option>
        <option value="grosir">Grosir</option>
      </select>
      <p class="small muted mt-2">Jenis penjualan berlaku untuk seluruh barang dalam transaksi.</p>

      <h3 class="section-title mt-3">Tambah Barang</h3>
      <form id="formItem">
        <label for="barangSearch">Barang</label>
        <div class="product-combobox" id="productCombobox">
          <div class="product-combobox__input-wrap">
            <input
              id="barangSearch"
              type="search"
              autocomplete="off"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="barangOptions"
              aria-expanded="false"
              placeholder="Ketik minimal 3 karakter..."
            >
            <button type="button" id="btnBrowseAll" class="product-combobox__browse" title="Lihat semua barang" aria-label="Lihat semua barang">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
          </div>
          <input id="barangId" type="hidden">
          <div id="barangOptions" class="product-options hidden" role="listbox"></div>
        </div>
        <p class="small muted mt-2">Ketik minimal 3 karakter atau <button type="button" class="link-btn" id="btnBrowseLink">pilih dari daftar</button> · <a href="/barang.html">Kelola master barang</a></p>

        <div class="form-row mt-2">
          <div style="max-width:90px;">
            <label for="quantity">Qty</label>
            <input id="quantity" type="number" min="1" value="1" required>
          </div>
          <div>
            <label for="harga">Harga Satuan</label>
            <input id="harga" type="number" min="1" required placeholder="0">
          </div>
        </div>

        <p class="small muted mt-2" id="previewSubtotal" style="min-height:18px;"></p>
        <button type="submit" class="secondary mt-2">+ Tambah ke Penjualan</button>
      </form>
    </section>

    <section class="card mt-3">
      <div class="item-top">
        <h3 class="section-title" style="margin:0;">Detail Penjualan</h3>
        <strong id="cartCount">0 barang</strong>
      </div>
      <div id="cartList" class="list mt-2"></div>
      <div class="item-top mt-3">
        <strong>Total</strong>
        <strong class="nominal" id="cartTotal">Rp 0</strong>
      </div>
      <p class="form-error" id="error"></p>
      <div class="form-row mt-3">
        <button type="button" class="secondary" id="btnPreview" disabled>Preview Nota</button>
        <button type="button" class="primary" id="btnSave" disabled>
          <span class="btn-label">Simpan Penjualan</span>
          <span class="btn-spinner"></span>
        </button>
      </div>
    </section>

    <section class="card mt-3">
      <div class="summary summary-income">
        <div class="summary-icon"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></div>
        <div class="summary-content">
          <div class="summary-label">Total Penjualan</div>
          <div class="summary-value" id="total">Rp 0</div>
        </div>
      </div>

      <div class="filter-bar" id="filterBar">
        <button class="btn-filter active" data-filter="today">Hari Ini</button>
        <button class="btn-filter" data-filter="yesterday">Kemarin</button>
        <button class="btn-filter" data-filter="custom">Pilih Tanggal</button>
      </div>
      <div id="customDateRange" class="hidden" style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="date" id="dateDari" class="filter-date-input" style="flex:1;">
        <input type="date" id="dateSampai" class="filter-date-input" style="flex:1;">
        <button class="btn-sm primary" id="btnFilterDate" style="width:auto;min-height:36px;">Filter</button>
      </div>

      <div id="list" class="list"></div>
    </section>
  </main>

  <!-- Product Browser Modal -->
  <div id="productBrowserModal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal product-browser-modal">
      <div class="product-browser__header">
        <h3 class="modal-title">Pilih Barang</h3>
        <button type="button" class="product-browser__close" data-action="close" aria-label="Tutup">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="product-browser__search">
        <input type="search" id="browserSearch" placeholder="Cari barang..." autocomplete="off">
      </div>
      <div class="product-browser__info">
        <span id="browserCount">0 barang</span>
        <span id="browserStatus" class="muted small"></span>
      </div>
      <div id="browserList" class="product-browser__list"></div>
    </div>
  </div>

  <div id="receiptPrint" class="receipt-print" aria-hidden="true"></div>

  <script src="/js/app.js"></script>
  <script src="/js/pemasukan.js"></script>
  <script>
    window.KasirApp.renderBottomNav('pemasukan');
    window.KasirApp.getSetting?.().then(r => {
      document.getElementById('warung').textContent = r.data.nama_warung || '';
    }).catch(() => {});
  </script>
</body>
</html>
