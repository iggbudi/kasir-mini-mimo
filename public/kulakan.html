<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kulakan — Kasir Mini</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.json">
</head>
<body>
  <main class="container">
    <div class="page-header">
      <a href="/" class="back-link">← Beranda</a>
      <span class="muted small" id="warung"></span>
    </div>

    <nav class="nav-links">
      <a href="/pemasukan.html" class="nav-link">Penjualan</a>
      <a href="/pengeluaran.html" class="nav-link">Pengeluaran</a>
      <a href="/kulakan.html" class="nav-link active">Kulakan</a>
    </nav>

    <h1 class="title">Kulakan</h1>

    <section class="card">
      <label for="salesmanId">Salesman</label>
      <select id="salesmanId" required><option value="">Memuat salesman...</option></select>
      <p class="small muted mt-2"><a href="/salesman.html">Kelola master salesman</a></p>

      <h3 class="section-title mt-3">Tambah Barang</h3>
      <form id="formItem">
        <label for="barangId">Barang</label>
        <select id="barangId" required><option value="">Memuat barang...</option></select>
        <div class="form-row mt-2">
          <div style="max-width:100px;">
            <label for="quantity">Qty</label>
            <input id="quantity" type="number" min="1" value="1" required>
          </div>
          <div>
            <label for="hargaBeli">Harga Beli Satuan</label>
            <input id="hargaBeli" type="number" min="1" required placeholder="0">
          </div>
        </div>
        <p class="small muted mt-2" id="previewSubtotal" style="min-height:18px;"></p>
        <button type="submit" class="secondary mt-2">+ Tambah ke Kulakan</button>
      </form>
    </section>

    <section class="card mt-3">
      <div class="item-top">
        <h3 class="section-title" style="margin:0;">Detail Kulakan</h3>
        <strong id="cartCount">0 barang</strong>
      </div>
      <div id="cartList" class="list mt-2"></div>
      <div class="item-top mt-3">
        <strong>Total Kas Keluar</strong>
        <strong class="nominal" id="cartTotal">Rp 0</strong>
      </div>
      <p class="form-error" id="error"></p>
      <button type="button" class="primary mt-3" id="btnSave" disabled>
        <span class="btn-label">Simpan Kulakan</span>
        <span class="btn-spinner"></span>
      </button>
    </section>

    <section class="card mt-3">
      <div class="summary summary-expense">
        <div class="summary-icon">📦</div>
        <div class="summary-content">
          <div class="summary-label">Total Kulakan</div>
          <div class="summary-value" id="total">Rp 0</div>
        </div>
      </div>
      <div class="filter-bar" id="filterBar">
        <button class="btn-filter active" data-filter="today">Hari Ini</button>
        <button class="btn-filter" data-filter="yesterday">Kemarin</button>
        <button class="btn-filter" data-filter="custom">Pilih Tanggal</button>
      </div>
      <div id="customDateRange" class="hidden" style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="date" id="dateDari" style="flex:1;">
        <input type="date" id="dateSampai" style="flex:1;">
        <button class="btn-sm primary" id="btnFilterDate" style="width:auto;">Filter</button>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/kulakan.js"></script>
  <script>
    window.KasirApp.renderBottomNav('kulakan');
    window.KasirApp.getSetting?.().then(r => {
      document.getElementById('warung').textContent = r.data.nama_warung || '';
    }).catch(() => {});
  </script>
</body>
</html>
